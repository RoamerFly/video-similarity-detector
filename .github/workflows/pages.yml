name: Deploy user guide to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/user-guide/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/screenshots
          cp -a docs/user-guide/. _site/
          cp -a docs/screenshots/. _site/screenshots/
          # The source page lives one directory below docs, while the deployed
          # artifact is rooted at the Pages site. Keep local preview links
          # readable and rewrite only the assembled copy for deployment.
          sed -i 's#../screenshots/#./screenshots/#g' _site/index.html
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/screenshots/analyze.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
