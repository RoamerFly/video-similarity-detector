name: Build And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string
      release_name:
        description: "Optional release title"
        required: false
        type: string
      release_notes:
        description: "Release notes shown in the app update dialog and at the top of the GitHub release"
        required: false
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create release as draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: true

env:
  APP_NAME: Video_Similarity
  DISPLAY_NAME: Video Similarity
  EXECUTABLE_NAME: video-similarity-desktop
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.10"
  CLIP_MODEL_REVISION: "3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268"
  DOWNLOAD_GUIDE: |
    ## 下载建议

    - Windows 普通用户：下载 `Video_Similarity-v*-windows-x64-cpu-installer.exe`
    - Windows NVIDIA GPU 用户：显卡为图灵架构或更新（计算能力 7.5 及以上），且驱动为 R580 或更新时，可下载 `Video_Similarity-v*-windows-x64-gpu-installer.exe`
    - Windows 免安装版：下载对应的 `windows-x64-*-portable.zip`，解压后运行其中的程序
    - macOS Apple 芯片（M 系列）：下载 `Video_Similarity-v*-macos-arm64-installer.dmg`
    - macOS Intel 芯片：下载 `Video_Similarity-v*-macos-x64-installer.dmg`
    - Linux Debian/Ubuntu：下载 `Video_Similarity-v*-linux-x64-installer.deb`
    - Linux Fedora/openSUSE/RHEL：下载 `Video_Similarity-v*-linux-x64-installer.rpm`
    - Linux 免安装版：下载 `Video_Similarity-v*-linux-x64-portable.tar.gz`

    应用本体、AI 运行环境、FFmpeg 环境和 CLIP 模型分别发布。视频合并只下载对应平台的 `Video_Similarity-ffmpeg-runtime-*` 小型压缩包，不会为了 FFmpeg 下载数百 MB 至 2 GiB 的 Python/PyTorch/CUDA 环境。首次进行 AI 分析时，才按需下载 AI 环境和约 600 MB 的 CLIP 模型。

    以后如果只是更新界面、编辑器、按钮、样式、Rust 或 Python 业务逻辑，用户通常只需下载几十 MB 的应用更新；已经安装的运行环境和模型会继续复用，只有它们自身升级时才重新下载。v1.0.x 用户若程序旁仍有旧 `env` 目录，可在“设置”中迁移，避免重复下载。

    每个平台的 AI 运行环境和 FFmpeg 视频合并环境都分别提供一个支持断点续传的 ZIP，并各自附带一个 `.sha256` 校验文件，不会出现同一模块拆成多个 part 压缩包的情况。离线模型文件名为 `clip-vit-base-patch32.zip`。

    `*-updater.exe`、`.sig`、运行环境 `.sha256`，以及 `latest.json`、`windows.json`、`darwin.json`、`linux.json` 主要供程序自动安装、更新和校验使用，普通用户无需手动下载。
jobs:
  quality:
    name: Quality checks
    uses: ./.github/workflows/ci.yml

  linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    needs: quality
    timeout-minutes: 120
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            zip

      - name: Verify committed version matches tag
        run: python scripts/set_release_version.py "$TAG_NAME" --check

      - name: Prepare standalone FFmpeg runtime
        run: |
          chmod +x scripts/prepare-ffmpeg-runtime.sh
          VIDEO_SIM_RUNTIME_DIR="desktop/merge-env" \
            ./scripts/prepare-ffmpeg-runtime.sh linux-x64

      - name: Set up updater signing key
        shell: bash
        run: |
          mkdir -p desktop/.tauri
          key="${TAURI_UPDATER_PRIVATE_KEY:-${TAURI_SIGNING_PRIVATE_KEY:-}}"
          if [ -z "$key" ]; then
            echo "::error::Missing updater signing key secret. Set TAURI_UPDATER_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          printf '%s' "$key" > desktop/.tauri/updater-key.private
          password="${TAURI_UPDATER_PRIVATE_KEY_PASSWORD:-${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}}"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$PWD/desktop/.tauri/updater-key.private"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
        env:
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build portable application directory
        working-directory: desktop
        run: |
          chmod +x build-linux.sh
          ./build-linux.sh \
            --skip-npm-audit \
            --python python \
            --torch-index-url https://download.pytorch.org/whl/cpu

      - name: Verify bundled Linux runtime
        run: |
          test -x desktop/merge-env/ffmpeg
          test -x desktop/merge-env/ffprobe
          test ! -e desktop/dist_linux/merge-env
          desktop/merge-env/ffmpeg -version
          desktop/merge-env/ffprobe -version

      - name: Package Linux assets
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          base="${APP_NAME}-${TAG_NAME}-linux-x64"
          dist_dir="$PWD/desktop/dist_linux"
          mkdir -p release-assets

          runtime_version="$(tr -d '[:space:]' < desktop/runtime-version.txt)"
          test -n "$runtime_version"
          runtime_base="${APP_NAME}-runtime-v${runtime_version}-linux-x64"
          runtime_root="$(mktemp -d)"
          mkdir -p "$runtime_root/env"
          cp -a "$dist_dir/env/." "$runtime_root/env/"
          (
            cd "$runtime_root"
            zip -r -9 "$GITHUB_WORKSPACE/release-assets/${runtime_base}.zip" env
          )
          (
            cd release-assets
            sha256sum "${runtime_base}.zip" > "${runtime_base}.zip.sha256"
          )

          merge_runtime_version="$(tr -d '[:space:]' < desktop/ffmpeg-runtime-version.txt)"
          test -n "$merge_runtime_version"
          merge_runtime_base="${APP_NAME}-ffmpeg-runtime-v${merge_runtime_version}-linux-x64"
          merge_runtime_root="$(mktemp -d)"
          mkdir -p "$merge_runtime_root/ffmpeg-env"
          cp desktop/merge-env/ffmpeg desktop/merge-env/ffprobe \
            desktop/merge-env/FFmpeg-GPL-3.0.txt "$merge_runtime_root/ffmpeg-env/"
          if [ -f desktop/merge-env/FFmpeg-LICENSE.txt ]; then
            cp desktop/merge-env/FFmpeg-LICENSE.txt "$merge_runtime_root/ffmpeg-env/"
          fi
          (
            cd "$merge_runtime_root"
            zip -r -9 "$GITHUB_WORKSPACE/release-assets/${merge_runtime_base}.zip" ffmpeg-env
          )
          (
            cd release-assets
            sha256sum "${merge_runtime_base}.zip" > "${merge_runtime_base}.zip.sha256"
          )

          light_dist="$(mktemp -d)"
          find "$dist_dir" -mindepth 1 -maxdepth 1 \
            ! -name env \
            ! -name merge-env \
            ! -name installer \
            ! -name models \
            ! -name data \
            -exec cp -a {} "$light_dist/" \;
          find "$light_dist" -maxdepth 1 -type f \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -delete
          test ! -e "$light_dist/env"
          test -x "$light_dist/video-similarity-desktop"
          test -s "$light_dist/runtime-version.txt"
          test -s "$light_dist/BUILD_FLAVOR.txt"

          tar -C "$light_dist" -czf "release-assets/${base}-portable.tar.gz" .

          package_root="$(mktemp -d)"
          mkdir -p \
            "$package_root/DEBIAN" \
            "$package_root/opt/${APP_NAME}" \
            "$package_root/usr/bin" \
            "$package_root/usr/share/applications" \
            "$package_root/usr/share/icons/hicolor/512x512/apps"
          cp -a "$light_dist/." "$package_root/opt/${APP_NAME}/"
          install -m 644 desktop/icon.png \
            "$package_root/usr/share/icons/hicolor/512x512/apps/video-similarity.png"
          cat > "$package_root/usr/bin/video-similarity" <<'SH'
          #!/usr/bin/env sh
          exec /opt/Video_Similarity/video-similarity-desktop "$@"
          SH
          chmod 755 "$package_root/usr/bin/video-similarity"
          cat > "$package_root/usr/share/applications/video-similarity.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Video Similarity
          Comment=Video similarity and containment detector
          Exec=/usr/bin/video-similarity
          Icon=video-similarity
          Terminal=false
          Categories=AudioVideo;Utility;
          DESKTOP
          installed_size="$(du -sk "$package_root" | cut -f1)"
          cat > "$package_root/DEBIAN/control" <<DEB
          Package: video-similarity
          Version: ${version}
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: RoamerFly
          Installed-Size: ${installed_size}
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Description: Video similarity and containment detector
          DEB
          dpkg-deb --root-owner-group --build \
            "$package_root" "release-assets/${base}-installer.deb"

          rpm_topdir="$PWD/rpmbuild"
          rpm_source="$(mktemp -d)"
          mkdir -p "$rpm_topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p "$rpm_source/video-similarity-${version}"
          cp -a "$package_root/opt" "$package_root/usr" \
            "$rpm_source/video-similarity-${version}/"
          tar -C "$rpm_source" -czf \
            "$rpm_topdir/SOURCES/video-similarity-${version}.tar.gz" \
            "video-similarity-${version}"
          cat > "$rpm_topdir/SPECS/video-similarity.spec" <<RPM
          %global __os_install_post %{nil}
          Name: video-similarity
          Version: ${version}
          Release: 1%{?dist}
          Summary: Video similarity and containment detector
          License: MIT
          BuildArch: x86_64
          Source0: %{name}-%{version}.tar.gz
          Requires: gtk3
          Requires: webkit2gtk4.1

          %description
          Local-first video similarity and containment detector.

          %prep
          %setup -q

          %build

          %install
          mkdir -p %{buildroot}
          cp -a opt usr %{buildroot}/

          %files
          /opt/Video_Similarity
          /usr/bin/video-similarity
          /usr/share/applications/video-similarity.desktop
          /usr/share/icons/hicolor/512x512/apps/video-similarity.png
          RPM
          rpmbuild --define "_topdir $rpm_topdir" -bb \
            "$rpm_topdir/SPECS/video-similarity.spec"
          rpm_assets=("$rpm_topdir/RPMS/x86_64/"*.rpm)
          test -f "${rpm_assets[0]}"
          cp "${rpm_assets[0]}" "release-assets/${base}-installer.rpm"

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  windows:
    name: Build Windows x64 (${{ matrix.flavor }})
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 120
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            env_dir: env
            dist_dir: dist_windows
          - flavor: gpu
            env_dir: env_gpu
            dist_dir: dist_windows_gpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify committed version matches tag
        shell: pwsh
        run: python scripts/set_release_version.py $env:TAG_NAME --check

      - name: Prepare standalone FFmpeg runtime
        shell: pwsh
        run: |
          .\scripts\prepare-ffmpeg-runtime.ps1 `
            -DestinationDir "desktop\merge-env"

      - name: Set up updater signing key
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop\.tauri | Out-Null
          $key = if ($env:TAURI_UPDATER_PRIVATE_KEY) {
            $env:TAURI_UPDATER_PRIVATE_KEY
          } elseif ($env:TAURI_SIGNING_PRIVATE_KEY) {
            $env:TAURI_SIGNING_PRIVATE_KEY
          } else {
            ""
          }
          if (-not $key) {
            throw "Missing updater signing key secret. Set TAURI_UPDATER_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY."
          }
          [System.IO.File]::WriteAllText("$pwd\desktop\.tauri\updater-key.private", $key, [System.Text.Encoding]::ASCII)
          $password = if ($env:TAURI_UPDATER_PRIVATE_KEY_PASSWORD) {
            $env:TAURI_UPDATER_PRIVATE_KEY_PASSWORD
          } elseif ($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          } else {
            ""
          }
          @(
            "TAURI_SIGNING_PRIVATE_KEY_PATH=$pwd\desktop\.tauri\updater-key.private",
            "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password"
          ) | Out-File -Append -Encoding UTF8 -FilePath $env:GITHUB_ENV
        env:
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build portable directory and installer
        shell: pwsh
        working-directory: desktop
        run: |
          if ("${{ matrix.flavor }}" -eq "gpu") {
            .\build-windows.ps1 `
              -SkipNpmAudit `
              -CleanPythonEnv `
              -BuildInstaller `
              -GpuBuild `
              -Python python
          } else {
            .\build-windows.ps1 `
              -SkipNpmAudit `
              -CleanPythonEnv `
              -BuildInstaller `
              -Python python
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Windows ${{ matrix.flavor }} build failed."
          }

      - name: Verify bundled Windows runtime
        shell: pwsh
        run: |
          $dist = "desktop\${{ matrix.dist_dir }}"
          if (Test-Path (Join-Path $dist "merge-env")) {
            throw "Portable Windows package unexpectedly contains merge-env. FFmpeg is a separate download."
          }
          foreach ($tool in @("ffmpeg.exe", "ffprobe.exe")) {
            $path = Join-Path "desktop\merge-env" $tool
            if (!(Test-Path $path) -or (Get-Item $path).Length -lt 5MB) {
              throw "$tool is missing or is not a standalone runtime."
            }
            $versionOutput = & $path -version 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "$tool failed its version check."
            }
            Write-Host ($versionOutput | Select-Object -First 1)
          }
          $python = Join-Path $dist "env\python\python.exe"
          if ("${{ matrix.flavor }}" -eq "gpu") {
            & $python -c "import torch; assert torch.version.cuda, 'CUDA runtime is not bundled'; print('CUDA runtime:', torch.version.cuda)"
          } else {
            & $python -c "import torch; assert torch.version.cuda is None, 'CPU package unexpectedly contains CUDA torch'; print('CPU-only torch:', torch.__version__)"
          }

      - name: Package Windows assets
        shell: pwsh
        run: |
          $base = "${env:APP_NAME}-${env:TAG_NAME}-windows-x64-${{ matrix.flavor }}"
          $dist = "desktop\${{ matrix.dist_dir }}"
          New-Item -ItemType Directory -Force "release-assets" | Out-Null

          $runtimeVersion = (Get-Content -Raw "desktop\runtime-version.txt").Trim()
          if (-not $runtimeVersion) {
            throw "desktop/runtime-version.txt is empty."
          }
          $runtimeBase = "${env:APP_NAME}-runtime-v${runtimeVersion}-windows-x64-${{ matrix.flavor }}"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP $runtimeBase
          New-Item -ItemType Directory -Force $runtimeRoot | Out-Null
          Copy-Item (Join-Path $dist "env") (Join-Path $runtimeRoot "env") -Recurse
          $runtimeZip = "release-assets\$runtimeBase.zip"
          & 7z a -tzip -mx=7 $runtimeZip (Join-Path $runtimeRoot "*")
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $runtimeZip)) {
            throw "Standalone Windows runtime ZIP was not generated."
          }
          $runtimeHash = (Get-FileHash -LiteralPath $runtimeZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $runtimeSize = (Get-Item -LiteralPath $runtimeZip).Length
          if ($runtimeSize -ge 2GB) {
            throw "Windows runtime exceeds GitHub's 2 GiB single-file limit: $runtimeSize bytes"
          }
          "$runtimeHash  $runtimeBase.zip" |
            Set-Content -LiteralPath "$runtimeZip.sha256" -Encoding ASCII

          # CPU and GPU jobs share the same platform-independent merge package.
          # Generate it once to avoid duplicate artifact names when the matrix
          # outputs are merged by the release job.
          if ("${{ matrix.flavor }}" -eq "cpu") {
            $mergeRuntimeVersion = (Get-Content -Raw "desktop\ffmpeg-runtime-version.txt").Trim()
            if (-not $mergeRuntimeVersion) {
              throw "desktop/ffmpeg-runtime-version.txt is empty."
            }
            $mergeRuntimeBase = "${env:APP_NAME}-ffmpeg-runtime-v${mergeRuntimeVersion}-windows-x64"
            $mergeRuntimeRoot = Join-Path $env:RUNNER_TEMP $mergeRuntimeBase
            $ffmpegAssetDir = Join-Path $mergeRuntimeRoot "ffmpeg-env"
            New-Item -ItemType Directory -Force $ffmpegAssetDir | Out-Null
            foreach ($file in @("ffmpeg.exe", "ffprobe.exe", "FFmpeg-GPL-3.0.txt")) {
              Copy-Item (Join-Path "desktop\merge-env" $file) $ffmpegAssetDir -Force
            }
            $optionalLicense = Join-Path "desktop\merge-env" "FFmpeg-LICENSE.txt"
            if (Test-Path $optionalLicense) {
              Copy-Item $optionalLicense $ffmpegAssetDir -Force
            }
            $mergeRuntimeZip = "release-assets\$mergeRuntimeBase.zip"
            & 7z a -tzip -mx=7 $mergeRuntimeZip (Join-Path $mergeRuntimeRoot "*")
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $mergeRuntimeZip)) {
              throw "Standalone Windows merge runtime ZIP was not generated."
            }
            $mergeRuntimeHash = (Get-FileHash -LiteralPath $mergeRuntimeZip -Algorithm SHA256).Hash.ToLowerInvariant()
            "$mergeRuntimeHash  $mergeRuntimeBase.zip" |
              Set-Content -LiteralPath "$mergeRuntimeZip.sha256" -Encoding ASCII
          }

          $portableRoot = Join-Path $env:RUNNER_TEMP "video-similarity-portable"
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          $excludedDirectories = @("env", "merge-env", "installer", "models", "data")
          Get-ChildItem -LiteralPath $dist | Where-Object {
            $excludedDirectories -notcontains $_.Name
          } | Copy-Item -Destination $portableRoot -Recurse
          foreach ($directory in $excludedDirectories) {
            if (Test-Path -LiteralPath (Join-Path $portableRoot $directory)) {
              throw "Lightweight application root unexpectedly contains $directory."
            }
          }
          $portableZip = "release-assets\$base-portable.zip"
          & 7z a -tzip -mx=7 $portableZip (Join-Path $portableRoot "*")
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $portableZip)) {
            throw "Lightweight portable ZIP was not generated."
          }

          $installerOutput = "release-assets\$base-installer.exe"
          $standardInstallers = @(
            Get-ChildItem -LiteralPath (Join-Path $dist "installer") `
              -Filter "*-setup.exe" -File -Recurse
          )
          if ($standardInstallers.Count -ne 1) {
            throw "Expected exactly one standard Tauri NSIS installer, found $($standardInstallers.Count)."
          }
          Copy-Item -LiteralPath $standardInstallers[0].FullName `
            -Destination $installerOutput -Force
          $installerVersion = (Get-Item -LiteralPath $installerOutput).VersionInfo
          if ($installerVersion.ProductName -ne "Video Similarity") {
            throw "Unexpected Windows installer product: $($installerVersion.ProductName)"
          }
          $passwordArg = "--password=$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          & ".\desktop\node_modules\.bin\tauri.cmd" signer sign $passwordArg $installerOutput
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$installerOutput.sig")) {
            throw "Standard Windows installer updater signature was not generated."
          }

          $updaterOutput = "release-assets\$base-updater.exe"
          Copy-Item -LiteralPath $installerOutput -Destination $updaterOutput -Force
          & ".\desktop\node_modules\.bin\tauri.cmd" signer sign $passwordArg $updaterOutput
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$updaterOutput.sig")) {
            throw "Standard Windows updater signature was not generated."
          }
          if ((Get-Item -LiteralPath $installerOutput).Length -ge 100MB) {
            throw "Standard Windows installer unexpectedly contains the AI runtime."
          }
          Get-ChildItem release-assets | Select-Object Name, Length

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ matrix.flavor }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: quality
    timeout-minutes: 120
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify committed version matches tag
        run: python scripts/set_release_version.py "$TAG_NAME" --check

      - name: Prepare standalone FFmpeg runtime
        run: |
          chmod +x scripts/prepare-ffmpeg-runtime.sh
          VIDEO_SIM_RUNTIME_DIR="desktop/merge-env" \
            ./scripts/prepare-ffmpeg-runtime.sh macos-${{ matrix.arch }}

      - name: Set up updater signing key
        shell: bash
        run: |
          mkdir -p desktop/.tauri
          key="${TAURI_UPDATER_PRIVATE_KEY:-${TAURI_SIGNING_PRIVATE_KEY:-}}"
          if [ -z "$key" ]; then
            echo "::error::Missing updater signing key secret. Set TAURI_UPDATER_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          printf '%s' "$key" > desktop/.tauri/updater-key.private
          password="${TAURI_UPDATER_PRIVATE_KEY_PASSWORD:-${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}}"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$PWD/desktop/.tauri/updater-key.private"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
        env:
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build portable application directory
        working-directory: desktop
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh --skip-npm-audit --python python

      - name: Verify bundled macOS runtime
        run: |
          test -x desktop/merge-env/ffmpeg
          test -x desktop/merge-env/ffprobe
          test ! -e desktop/dist_macos/merge-env
          desktop/merge-env/ffmpeg -version
          desktop/merge-env/ffprobe -version

      - name: Package macOS assets
        shell: bash
        run: |
          set -euo pipefail
          base="${APP_NAME}-${TAG_NAME}-macos-${{ matrix.arch }}"
          version="${TAG_NAME#v}"
          app_dir="$RUNNER_TEMP/${DISPLAY_NAME}.app"
          dmg_root="$RUNNER_TEMP/dmg-root"
          iconset="$RUNNER_TEMP/AppIcon.iconset"
          dist_dir="$PWD/desktop/dist_macos"
          mkdir -p \
            release-assets \
            "$app_dir/Contents/MacOS" \
            "$app_dir/Contents/Resources" \
            "$iconset"

          runtime_version="$(tr -d '[:space:]' < desktop/runtime-version.txt)"
          test -n "$runtime_version"
          runtime_base="${APP_NAME}-runtime-v${runtime_version}-macos-${{ matrix.arch }}"
          runtime_root="$(mktemp -d)"
          mkdir -p "$runtime_root/env"
          cp -a "$dist_dir/env/." "$runtime_root/env/"
          (
            cd "$runtime_root"
            zip -r -9 "$GITHUB_WORKSPACE/release-assets/${runtime_base}.zip" env
          )
          (
            cd release-assets
            shasum -a 256 "${runtime_base}.zip" > "${runtime_base}.zip.sha256"
          )

          merge_runtime_version="$(tr -d '[:space:]' < desktop/ffmpeg-runtime-version.txt)"
          test -n "$merge_runtime_version"
          merge_runtime_base="${APP_NAME}-ffmpeg-runtime-v${merge_runtime_version}-macos-${{ matrix.arch }}"
          merge_runtime_root="$(mktemp -d)"
          mkdir -p "$merge_runtime_root/ffmpeg-env"
          cp desktop/merge-env/ffmpeg desktop/merge-env/ffprobe \
            desktop/merge-env/FFmpeg-GPL-3.0.txt "$merge_runtime_root/ffmpeg-env/"
          if [ -f desktop/merge-env/FFmpeg-LICENSE.txt ]; then
            cp desktop/merge-env/FFmpeg-LICENSE.txt "$merge_runtime_root/ffmpeg-env/"
          fi
          (
            cd "$merge_runtime_root"
            zip -r -9 "$GITHUB_WORKSPACE/release-assets/${merge_runtime_base}.zip" ffmpeg-env
          )
          (
            cd release-assets
            shasum -a 256 "${merge_runtime_base}.zip" > "${merge_runtime_base}.zip.sha256"
          )

          light_dist="$(mktemp -d)"
          find "$dist_dir" -mindepth 1 -maxdepth 1 \
            ! -name env \
            ! -name merge-env \
            ! -name installer \
            ! -name models \
            ! -name data \
            -exec cp -a {} "$light_dist/" \;
          find "$light_dist" -maxdepth 1 -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" \) -delete
          test ! -e "$light_dist/env"
          test -x "$light_dist/video-similarity-desktop"
          test -s "$light_dist/runtime-version.txt"
          test -s "$light_dist/BUILD_FLAVOR.txt"
          cp -a "$light_dist/." "$app_dir/Contents/MacOS/"

          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" desktop/icon.png \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double_size=$((size * 2))
            sips -z "$double_size" "$double_size" desktop/icon.png \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" \
            -o "$app_dir/Contents/Resources/icon.icns"

          cat > "$app_dir/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>${DISPLAY_NAME}</string>
            <key>CFBundleExecutable</key>
            <string>${EXECUTABLE_NAME}</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.videosimilarity.desktop</string>
            <key>CFBundleName</key>
            <string>${DISPLAY_NAME}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          chmod +x \
            "$app_dir/Contents/MacOS/${EXECUTABLE_NAME}" \
            "$app_dir/Contents/MacOS/run-video-similarity.command"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$app_dir" "release-assets/${base}-portable.zip"

          mkdir -p "$dmg_root"
          cp -R "$app_dir" "$dmg_root/"
          ln -s /Applications "$dmg_root/Applications"
          test -d "$dmg_root/${DISPLAY_NAME}.app"
          test -L "$dmg_root/Applications"
          dmg_path="release-assets/${base}-installer.dmg"
          for attempt in 1 2 3; do
            rm -f "$dmg_path"
            if hdiutil create -volname "$DISPLAY_NAME" -srcfolder "$dmg_root" \
              -ov -format UDZO "$dmg_path"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to create macOS DMG after ${attempt} attempts." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows
      - macos
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Sign non-Windows updater assets
        shell: bash
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p .tauri
          key="${TAURI_UPDATER_PRIVATE_KEY:-${TAURI_SIGNING_PRIVATE_KEY:-}}"
          if [ -z "$key" ]; then
            echo "::error::Missing updater signing key secret. Set TAURI_UPDATER_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          printf '%s' "$key" > .tauri/updater-key.private
          export TAURI_SIGNING_PRIVATE_KEY_PATH="$PWD/.tauri/updater-key.private"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_UPDATER_PRIVATE_KEY_PASSWORD:-${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}}"
          unset TAURI_UPDATER_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY

          assets=(
            "release-assets/${APP_NAME}-${TAG_NAME}-linux-x64-installer.deb"
            "release-assets/${APP_NAME}-${TAG_NAME}-macos-arm64-installer.dmg"
            "release-assets/${APP_NAME}-${TAG_NAME}-macos-x64-installer.dmg"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
            if [ ! -f "$asset.sig" ]; then
              npx --yes @tauri-apps/cli@2 signer sign \
                --password="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" \
                "$asset"
            fi
            test -s "$asset.sig"
          done

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          RELEASE_NOTES_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
            release_name="${{ inputs.release_name }}"
            release_notes="${RELEASE_NOTES_INPUT:-}"
            prerelease="${{ inputs.prerelease }}"
            draft="${{ inputs.draft }}"
          else
            tag_name="${GITHUB_REF_NAME}"
            release_name=""
            release_notes=""
            prerelease="false"
            draft="false"
          fi
          if [ -z "$release_name" ]; then
            release_name="${DISPLAY_NAME} ${tag_name}"
          fi
          if [ -z "$release_notes" ]; then
            if [ -s release_note.txt ]; then
              release_notes="$(cat release_note.txt)"
            else
              release_notes=$'## 更新内容\n\n- 本次发布包含最新应用构建、自动更新元数据和离线 CLIP 模型资源。'
            fi
          fi
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          {
            echo "release_notes<<EOF"
            echo "$release_notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - name: Prepare offline CLIP model asset
        shell: bash
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/clip-model/clip-vit-base-patch32"
          mkdir -p "$model_dir" model-assets
          base_url="https://huggingface.co/openai/clip-vit-base-patch32/resolve/${CLIP_MODEL_REVISION}"
          files=(
            "config.json"
            "preprocessor_config.json"
            "pytorch_model.bin"
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 20 \
              --output "$model_dir/$file" \
              "$base_url/$file?download=true"
            test -s "$model_dir/$file" || {
              echo "Downloaded model file is empty: $file" >&2
              exit 1
            }
          done
          (
            cd "$model_dir"
            echo "b575ef3c36f2a057fa19e221650105052d61cc9c1a972ec15019c6261ec98770  config.json" | sha256sum --check -
            echo "910e70b3956ac9879ebc90b22fb3bc8a75b6a0677814500101a4c072bd7857bd  preprocessor_config.json" | sha256sum --check -
            echo "a63082132ba4f97a80bea76823f544493bffa8082296d62d71581a4feff1576f  pytorch_model.bin" | sha256sum --check -
          )
          (
            cd "$RUNNER_TEMP/clip-model"
            zip -0 -r "$GITHUB_WORKSPACE/model-assets/clip-vit-base-patch32.zip" \
              clip-vit-base-patch32
          )
          test -s model-assets/clip-vit-base-patch32.zip
          unzip -l model-assets/clip-vit-base-patch32.zip

      - name: Verify release asset names
        shell: bash
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          runtime_version="$(tr -d '[:space:]' < desktop/runtime-version.txt)"
          test -n "$runtime_version"
          merge_runtime_version="$(tr -d '[:space:]' < desktop/ffmpeg-runtime-version.txt)"
          test -n "$merge_runtime_version"
          expected=(
            "${APP_NAME}-${TAG_NAME}-linux-x64-installer.deb"
            "${APP_NAME}-${TAG_NAME}-linux-x64-installer.deb.sig"
            "${APP_NAME}-${TAG_NAME}-linux-x64-installer.rpm"
            "${APP_NAME}-${TAG_NAME}-linux-x64-portable.tar.gz"
            "${APP_NAME}-${TAG_NAME}-macos-arm64-installer.dmg"
            "${APP_NAME}-${TAG_NAME}-macos-arm64-installer.dmg.sig"
            "${APP_NAME}-${TAG_NAME}-macos-arm64-portable.zip"
            "${APP_NAME}-${TAG_NAME}-macos-x64-installer.dmg"
            "${APP_NAME}-${TAG_NAME}-macos-x64-installer.dmg.sig"
            "${APP_NAME}-${TAG_NAME}-macos-x64-portable.zip"
            "${APP_NAME}-${TAG_NAME}-windows-x64-cpu-installer.exe"
            "${APP_NAME}-${TAG_NAME}-windows-x64-cpu-installer.exe.sig"
            "${APP_NAME}-${TAG_NAME}-windows-x64-cpu-portable.zip"
            "${APP_NAME}-${TAG_NAME}-windows-x64-cpu-updater.exe"
            "${APP_NAME}-${TAG_NAME}-windows-x64-cpu-updater.exe.sig"
            "${APP_NAME}-${TAG_NAME}-windows-x64-gpu-installer.exe"
            "${APP_NAME}-${TAG_NAME}-windows-x64-gpu-installer.exe.sig"
            "${APP_NAME}-${TAG_NAME}-windows-x64-gpu-portable.zip"
            "${APP_NAME}-${TAG_NAME}-windows-x64-gpu-updater.exe"
            "${APP_NAME}-${TAG_NAME}-windows-x64-gpu-updater.exe.sig"
            "${APP_NAME}-runtime-v${runtime_version}-windows-x64-cpu.zip"
            "${APP_NAME}-runtime-v${runtime_version}-windows-x64-cpu.zip.sha256"
            "${APP_NAME}-runtime-v${runtime_version}-windows-x64-gpu.zip"
            "${APP_NAME}-runtime-v${runtime_version}-windows-x64-gpu.zip.sha256"
            "${APP_NAME}-runtime-v${runtime_version}-macos-arm64.zip"
            "${APP_NAME}-runtime-v${runtime_version}-macos-arm64.zip.sha256"
            "${APP_NAME}-runtime-v${runtime_version}-macos-x64.zip"
            "${APP_NAME}-runtime-v${runtime_version}-macos-x64.zip.sha256"
            "${APP_NAME}-runtime-v${runtime_version}-linux-x64.zip"
            "${APP_NAME}-runtime-v${runtime_version}-linux-x64.zip.sha256"
            "${APP_NAME}-ffmpeg-runtime-v${merge_runtime_version}-windows-x64.zip"
            "${APP_NAME}-ffmpeg-runtime-v${merge_runtime_version}-windows-x64.zip.sha256"
            "${APP_NAME}-ffmpeg-runtime-v${merge_runtime_version}-macos-arm64.zip"
            "${APP_NAME}-ffmpeg-runtime-v${merge_runtime_version}-macos-arm64.zip.sha256"
            "${APP_NAME}-ffmpeg-runtime-v${merge_runtime_version}-macos-x64.zip"
            "${APP_NAME}-ffmpeg-runtime-v${merge_runtime_version}-macos-x64.zip.sha256"
            "${APP_NAME}-ffmpeg-runtime-v${merge_runtime_version}-linux-x64.zip"
            "${APP_NAME}-ffmpeg-runtime-v${merge_runtime_version}-linux-x64.zip.sha256"
          )
          test -f "model-assets/clip-vit-base-patch32.zip" || {
            echo "Missing model asset: clip-vit-base-patch32.zip" >&2
            exit 1
          }
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset" || {
              echo "Missing release asset: $asset" >&2
              exit 1
            }
          done
          gpu_runtime="release-assets/${APP_NAME}-runtime-v${runtime_version}-windows-x64-gpu.zip"
          gpu_runtime_size="$(stat -c %s "$gpu_runtime")"
          if [ "$gpu_runtime_size" -ge 2147483648 ]; then
            echo "Windows GPU runtime exceeds GitHub's 2 GiB limit: $gpu_runtime_size bytes" >&2
            exit 1
          fi
          ls -lh model-assets
          ls -lh release-assets

      - name: Generate release body
        shell: bash
        env:
          RELEASE_NOTES: ${{ steps.meta.outputs.release_notes }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$RELEASE_NOTES"
            if ! grep -q '^## 下载建议$' <<< "$RELEASE_NOTES"; then
              echo
              printf '%s\n' "$DOWNLOAD_GUIDE"
            fi
          } > release_body.md
          printf '%s\n' "$RELEASE_NOTES" > release_notes.md
          cat release_body.md
      - name: Verify standalone FFmpeg asset contents
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release-assets/*-ffmpeg-runtime-*.zip)
          test "${#archives[@]}" -eq 4 || {
            echo "Expected four standalone FFmpeg runtime ZIPs, found ${#archives[@]}" >&2
            exit 1
          }
          for archive in "${archives[@]}"; do
            archive_name="$(basename "$archive")"
            checksum="${archive}.sha256"
            test -s "$checksum" || { echo "Missing checksum: $checksum" >&2; exit 1; }
            (
              cd release-assets
              sha256sum -c "${archive_name}.sha256"
            )
            while IFS= read -r entry; do
              case "$entry" in
                ffmpeg-env/|ffmpeg-env/ffmpeg|ffmpeg-env/ffprobe|ffmpeg-env/ffmpeg.exe|ffmpeg-env/ffprobe.exe|ffmpeg-env/FFmpeg-LICENSE.txt|ffmpeg-env/FFmpeg-GPL-3.0.txt) ;;
                *)
                  echo "Unexpected entry in standalone FFmpeg asset $archive_name: $entry" >&2
                  exit 1
                  ;;
              esac
            done < <(unzip -Z1 "$archive")
            entries="$(unzip -Z1 "$archive")"
            if [[ "$entries" != *"ffmpeg-env/ffmpeg"* && "$entries" != *"ffmpeg-env/ffmpeg.exe"* ]]; then
              echo "FFmpeg executable missing from $archive_name" >&2
              exit 1
            fi
            if [[ "$entries" != *"ffmpeg-env/ffprobe"* && "$entries" != *"ffmpeg-env/ffprobe.exe"* ]]; then
              echo "FFprobe executable missing from $archive_name" >&2
              exit 1
            fi
          done
      - name: Generate updater metadata
        shell: bash
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/finalize-updater-metadata.mjs "$TAG_NAME" "$GITHUB_REPOSITORY" release-assets release_notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          body_path: release_body.md
          draft: ${{ steps.meta.outputs.draft == 'true' }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            model-assets/clip-vit-base-patch32.zip
            release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Remove obsolete release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          release_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
            --jq '.id')"
          find release-assets model-assets -maxdepth 1 -type f \
            -printf '%f\n' | sort -u > expected-assets.txt
          while IFS=$'\t' read -r asset_id asset_name; do
            if ! grep -Fqx "$asset_name" expected-assets.txt; then
              echo "Deleting obsolete release asset: $asset_name"
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
              --jq '.[] | [.id, .name] | @tsv'
          )
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[].name' | sort -u > published-assets.txt
          diff -u expected-assets.txt published-assets.txt
