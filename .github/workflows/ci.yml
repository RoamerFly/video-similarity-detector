name: Quality Checks

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q -f video_sim scripts app.py

      - name: Run Python tests
        run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check duplicate CSS rules
        run: npm run lint:css

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust tests and Clippy
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test Windows updater packager
        shell: powershell
        working-directory: ${{ github.workspace }}
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "windows-updater-packager-smoke"
          $payloadRoot = Join-Path $smokeRoot "payload"
          $payloadZip = Join-Path $smokeRoot "payload.zip"
          $updaterExe = Join-Path $smokeRoot "updater.exe"
          New-Item -ItemType Directory -Force $payloadRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $payloadRoot "smoke.txt") -Value "ok" -Encoding ASCII
          Compress-Archive -Path (Join-Path $payloadRoot "*") -DestinationPath $payloadZip -Force
          & ".\scripts\build-windows-self-extractor.ps1" `
            -PayloadZip $payloadZip `
            -OutputExe $updaterExe `
            -DisplayName "Video Similarity" `
            -InstallFolderName "Video Similarity" `
            -PreserveRuntimeOnUpdate
          if (!(Test-Path -LiteralPath $updaterExe -PathType Leaf)) {
            throw "Windows updater packager smoke test did not create updater.exe."
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked
