<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <title>Video Similarity</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #020617;
      }

      body {
        overflow: hidden;
      }

      .boot-splash {
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        gap: 14px;
        color: rgba(226, 232, 255, 0.82);
        font: 14px/1.5 "Microsoft YaHei", "Segoe UI", sans-serif;
        text-align: center;
      }

      .boot-splash::before {
        width: 34px;
        height: 34px;
        margin: 0 auto;
        border: 3px solid rgba(116, 145, 255, 0.24);
        border-top-color: #2688ff;
        border-radius: 50%;
        content: "";
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">正在启动 Video Similarity…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
